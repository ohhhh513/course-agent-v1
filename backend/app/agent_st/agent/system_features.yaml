    steps: [点击历史会话条目上的「删除会话」小按钮，进入确认状态后再次点击确认删除。]
    notes: [删除会话会清理其消息引用的保存附件。]
    anchors: [删除会话, btn.dataset.armed]
  - id: chat.recommend
