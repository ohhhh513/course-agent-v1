    location: 对话区顶部「新建会话」及右侧「历史会话」
    steps: [点对话区顶部「新建会话」开始空对话。, 点击右侧「历史会话」中的条目切换查看；每次登录首次进入从新对话开始，同次登录返回页面时恢复上次打开的会话。]
