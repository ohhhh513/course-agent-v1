    aliases: [发送, Enter, Shift+Enter, 停止生成]
    location: 智能体页面中间对话区底部输入框及右侧发送按钮
    steps: [输入问题后按 Enter 或点击发送按钮；Shift + Enter 换行。, 回答生成时发送按钮变为「停止生成」，点击可停止并保留已经生成的内容。]
    anchors: [chatInput, chatSend, Shift+Enter, 停止生成]
