    steps: [点击输入框旁上传按钮选择文件，可多选；输入问题后一起发送。, 待发附件右上角小「×」可移除；图片展示缩略图，文档展示文件名。]
    notes: [三端均支持 TXT / MD / CSV / JSON / XLSX / DOCX / PDF 和 JPG / JPEG / PNG / GIF / WebP；每轮最多 5 个附件，单个不超过 10 MB，图片总大小不超过 32 MB。, 聊天上传不会自动加入课程资源或知识库；识图需要当前模型支持视觉输入。]
