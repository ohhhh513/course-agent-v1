      graph-edit:
        title: 知识图谱编排
        source: assets/js/teacher/views/graph-edit.js
        prerequisites: [先在课程目录与资源建立章节和知识点，再选择对应课程编排。]
        features:
          - id: teacher.graph.nodes
            title: 知识点目录、待更新与节点布点
            aliases: [待更新, 添加图谱节点, 从目录刷新, 节点详情]
            location: 知识图谱编排的左侧页签与中间画布
            steps: [左侧「知识点目录」查看课程知识点；「待更新」查看尚未布点的新增知识点。, 点击左侧知识点在画布定位或布点，拖拽节点调整位置。, 点击画布节点显示右侧「知识点详情」，右上角「×」关闭；修改课程知识点后可点顶部「从目录刷新」。]
            notes: [图谱节点来自课程知识点，新增知识点要在「课程目录与资源」操作；「从目录刷新」会重新载入，先保存想保留的改动。]
            anchors: [知识点目录, 待更新, geRefresh, geDClose, _openDetail]
          - id: teacher.graph.kp.edit
            title: 在图谱右侧详情修改或删除课程知识点
            aliases: [图谱知识点名称, 图谱重点标记, 图谱知识点介绍, 详情保存修改]
            location: 知识图谱编排 → 点击画布节点 → 右侧「知识点详情」
            steps: [点击画布节点，在右侧「知识点详情」修改知识点名称、学时、重点或知识点介绍。, 点右侧面板底部「保存修改」立即保存知识点信息；该面板所属章节只读，换章请到课程目录与资源。, 点面板底部「删除知识点」并确认会删除课程知识点。]
            notes: [此处「保存修改」保存知识点资料；页面顶部「保存图谱」保存位置和关系。, 详情中的「删除知识点」与工具栏「删除选中」作用不同，不要混淆。]
            anchors: [geDName_i, geDChap_i, geDHours_i, geDKey_i, geDSum_i, geDSave, geDDel]
          - id: teacher.graph.link
            title: 用节点上的加号连接知识点关系
            aliases: [连线, 前置, 进阶, 并列, 节点加号, 加关系]
            location: 知识图谱编排画布的知识点节点悬停小「＋」
            steps: [把鼠标移到起点知识点，点击节点上出现的小「＋」。, 在关系菜单选「前置」「进阶」或「并列」，再点击目标知识点完成连线。, 菜单「取消」或按 Esc 可取消连线；完成后点顶部「保存图谱」。]
            anchors: [悬停节点点「+」连线, data-rel, 前置, 进阶, 并列, Escape]
          - id: teacher.graph.delete
            title: 删除选中节点或连线
            aliases: [删除选中, 删除关系]
            location: 知识图谱编排画布上方工具栏
            steps: [在画布点击节点或连线选中它，再点工具栏「删除选中」。, 确认布局正确后点击顶部「保存图谱」。]
            notes: [删除画布节点不等同于删除课程知识点；删除课程知识点需在课程目录中操作。]
            anchors: [geDel, 删除选中, geSave]
          - id: teacher.graph.undo
            title: 撤回图谱修改、适配视图和保存
            aliases: [撤回上一步, Ctrl+Z, 适配视图, 保存图谱, 图谱缩放]
            location: 知识图谱编排画布上方工具栏和页面右上角
            steps: [点「撤回」或按 Ctrl / Command + Z 撤回上一步；点「适配视图」让图谱适应画布。, 画布可平移和滚轮缩放，节点可拖拽；调整完成点页面右上角「保存图谱」。]
            anchors: [geUndo, geFit, geSave, wheel]
      chat:
        title: 智能助手
        source: assets/js/teacher/views/chat.js
        features: []
  admin:
    chat_view: assistant
    pages:
      users:
        title: 账号管理
        source: assets/js/admin/views/users.js
        features:
          - id: admin.users.list
            title: 查找教师学生账号并选择账号
            aliases: [教师学生账号, 账号搜索, 角色筛选, 全选]
            location: 账号管理的教师 / 学生账号列表
            steps: [打开「账号管理」，按页面的角色筛选和搜索框查找账号。, 使用行首复选框勾选目标账号，表头复选框可选择当前列表，用于批量删除。]
            anchors: [fKey, fRole, pickAll, type="checkbox"]
          - id: admin.users.create
            title: 新建教师或学生账号
            aliases: [新建账号, 创建用户]
            location: 账号管理顶部「新建账号」
            steps: [点「新建账号」，选择教师或学生角色，填写用户名、姓名和密码。, 按角色填写班级或部门等信息，点击弹窗底部「创建」。]
            anchors: [新建账号, cuGo]
          - id: admin.users.edit
            title: 修改账号资料或重置密码
            aliases: [编辑账号, 重置密码, 修改姓名, 学号, 部门, 职称]
            location: 账号管理 → 账号行右侧「编辑」→ 编辑账号弹窗
            steps: [找到账号，点该行「编辑」。, 可修改用户名、姓名及学生班级、学号或教师部门、职称；要重置密码，在「重置密码」填写至少 6 位新密码，留空则保持原密码。, 点击底部「保存」。]
            notes: [编辑弹窗不提供修改角色；不要声称可以改成管理员。]
            anchors: [data-edit, 编辑账号, 重置密码, euGo]
          - id: admin.users.password
            title: 在账号管理中手动重置密码
            aliases: [重置学生密码, 重置教师密码, 修改账号密码]
            location: 账号管理 → 目标账号行右侧「编辑」→「编辑账号」弹窗
            steps: [找到目标账号，点击该行右侧「编辑」。, 在弹窗「重置密码」填写至少 6 位新密码，点击底部「保存」。]
            notes: [重置密码留空则不修改密码。]
            anchors: [data-edit, 编辑账号, euPwd, 至少 6 位, euGo]
          - id: admin.users.import.template
            title: 批量导入账号并下载模板
            aliases: [批量导入, Excel 模板, Word 模板, 导入角色]
            location: 账号管理顶部「批量导入」→ 导入向导第 1 步
            steps: [点击「批量导入」，第 1 步选择学生或教师。, 点击「下载 Excel 模板」或「下载 Word 模板」，按模板填写；点「下一步」进入上传。]
            anchors: [第 1 步, dlXlsx, dlDocx, next1]
          - id: admin.users.import.file
            title: 导入账号文件、设置初始密码和解析预览
            aliases: [统一初始密码, 解析预览, 选择文件, xlsx, docx]
            location: 批量导入向导第 2 步与第 3 步
            steps: [第 2 步「选择文件」上传 .xlsx 或 .docx；可填写统一初始密码，至少 6 位，填写后覆盖文件密码列。, 点「解析预览」，在第 3 步核对有效记录与错误记录；需调整时点「上一步」。, 核对后点「导入…条」，完成后点「返回账号列表」。]
            anchors: [第 2 步, 统一初始密码, id="parse", 第 3 步, id="go", 返回账号列表]
          - id: admin.users.delete
            title: 删除单个账号
            aliases: [删除账号, 确认删除, 输入用户名]
            location: 账号管理的账号行右侧「删除」
            steps: [点目标账号行「删除」，核对账号及影响。, 在确认输入框填写该账号用户名，再点「确认删除」；不删除则点「取消」。]
            notes: [不能删除当前登录账号、管理员账号或拥有课程的教师；以页面实际校验和拒绝原因作准。]
            anchors: [data-del, 删除账号, delGo]
          - id: admin.users.batch.delete
            title: 勾选并批量删除账号
            aliases: [批量删除, 输入数量, 已选账号]
            location: 账号管理的列表复选框与顶部「批量删除」
            steps: [勾选需要删除的账号，点击顶部「批量删除」。, 在弹窗核对所勾选账号名单和删除影响，输入弹窗提示的勾选账号数量，点「确认删除」。, 操作后查看成功、被拒或失败数量；若有未删除账号，查看结果列表中的原因。]
            notes: [数量确认按全部勾选账号计数；受保护账号会在执行时被拒并列入结果，不是预先从确认数量中排除。]
            anchors: [批量删除账号, bdGo, bdConfirm]
          - id: admin.users.batch.result
            title: 查看批量删除失败或被拒原因
            aliases: [未删除的账号, 已拒绝, 知道了]
            location: 批量删除后出现的「未删除的账号」弹窗
            steps: [在「未删除的账号」弹窗查看用户名、结果和原因，点底部「知道了」关闭。]
            anchors: [未删除的账号, showBatchResult, 知道了]
      assistant:
        title: 智能助手
        source: assets/js/admin/views/assistant.js
        features:
          - id: admin.assistant.platform
            title: 查询平台运行、账号课程规模和数据检查
            aliases: [平台治理, 知识库索引, 数据一致性, 系统状态]
            location: 管理员左侧「智能助手」
            steps: [在智能助手输入所需平台问题，例如账号数量、课程规模、知识库索引状态或数据一致性。, 助手调用平台只读查询工具后回答；班级教学详情需要任课教师查看。]
            notes: [当前没有管理员图形化索引重建、课程内容编辑或通知发送面板，不要编造入口。]
            anchors: [平台治理, kb_status, data_check]
shared:
  - id: system.modal
