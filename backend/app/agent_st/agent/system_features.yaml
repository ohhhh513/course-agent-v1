    aliases: [猜你想问, 推荐问题, 用户偏好]
    location: 智能体页面右侧「猜你想问」面板
    steps: [查看「猜你想问」推荐，点击问题发起提问。, 教师和管理员推荐结合当前课程或平台数据及本人近期对话主题调整；数据不足时可能没有推荐。]
    anchors: [猜你想问, recommended, emptyRecommend]
  - id: chat.sources
    title: 展开思考工具过程或原文溯源
    aliases: [思考与工具调用, 原文溯源, 引用来源, 检索证据]
    location: AI 回答的折叠面板与引用区域
    steps: [点击「思考与工具调用」展开或折叠工具过程。, 有引用时点击「原文溯源」查看来源；纯系统操作指导可能没有教材引用。]
    anchors: [思考与工具调用, 原文溯源]
  - id: chat.action
    title: 使用页面跳转按钮或确认待批准动作
    aliases: [打开页面, 确认执行, 拒绝, 确认卡片]
    location: AI 回答下方的建议按钮或待批准卡片
    steps: [点击回答下方页面按钮进入对应页面，再按回答中的按钮位置自行操作。, 遇到「待批准」卡片时先核对摘要和影响，再点「确认执行」或「拒绝」；页面跳转本身不会编辑或保存数据。]
    notes: [学生端没有业务写操作审批工具；教师或管理员只可批准本角色已支持的操作。]
    anchors: [data-agent-action, 确认执行, 拒绝]
