    source: assets/js/common.js
    navigation: false
    location: 当前三端公共界面
    steps: [界面目前固定使用亮色主题，没有可用的夜间模式切换入口。]
    notes: [侧栏底部用户信息仅展示当前用户，不提供个人资料编辑面板；账号资料由管理员在账号管理中编辑。]
