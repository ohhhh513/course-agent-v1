id: explain
name: 智能讲解
persona: course_tutor
skills:
  - explain.md
tools:
  - resolve_topic
  - retrieve_chunks
  - get_question
max_steps: 6
steps:
  - 用 resolve_topic 定位本课程的章(CH0x)与知识点(KP0xx)；text 传用户原话整句，禁止拆词或自判知识点；上下文若有 q_id 必须传入
  - 即使 uncertain=true，仍用用户原话调用 retrieve_chunks，不要拒绝检索
  - 若有 q_id，调用 get_question（默认不要 include_answer）
  - 必须调用 retrieve_chunks，source_types 默认 question_analysis、textbook、ppt
  - 有命中则关键断言标注 [题号 q_id] 或 [知识点 KP0xx]；命中不足时用【补充】声明非课程原文，禁止伪造引用
  - 按 explain.md 结构讲解（结论 → 依据 → 可选补充 → 易错点）
