id: explain
name: 智能讲解
roles: [student, teacher]            # 谁可以用这条流（服务端按登录用户角色校验）；管理员走 admin_ops 流，不进教学流
persona: course_tutor
skills:
  - explain.md
  - system_guide.md
tools:
  - get_system_guide
  - prepare_ui_action
  - resolve_topic
  - retrieve_chunks
  - get_question
  - explain_metric
  - my_alerts
  - breakdown
  - weak_ranking
  - my_last_attempt
  - suggest_action
  - offer_choices
  # 教师视角（roles=teacher，学生与管理员都看不到；见 tools/teacher_analytics.py）
  - class_overview
  - class_alerts
  - student_profile
  - kp_heatmap
  - hot_wrong_questions
  - class_question_hotspots
max_steps: 10
steps:
  - 先区分系统操作帮助、当前角色的学情数据查询和课程知识讲解，混合问题分别查询必要依据
  - 按本轮语义和最近对话识别操作及资料入口追问，承接唯一指代对象；先 get_system_guide 核实，目标明确且有入口必须 prepare_ui_action。跳转须用户本轮确认：询问/讲解/学情 auto=false 给真实按钮，本轮明确要求打开或跳转才 auto=true；多个对象先澄清，纯知识解释不强制导航；不自动保存、发送、加入或正式导入
  - 学情数据问题按 explain.md 使用当前角色的只读查询工具，不要求教材检索。教师问全班最近在问什么或哪一章提问最多时调用 class_question_hotspots，只报告知识点、章节、提问次数和总数；教师点名某个学生问近期情况时调用 student_profile，默认 days=7，结合近期练习、学习路径和每五分钟增量更新的 AI 互动摘要回答；只展示知识点、章节和概括性疑惑，不展示、引用或改写原始问句。若主题有非空 likelyDoubt，必须呈现归纳疑惑；confidence 仅说明推断强弱，不得因此漏掉已有疑惑或声称内容未显示。区分实际答错与提问推断，单次提问不能断言为薄弱点；说明 AI 摘要覆盖日期及最近扫描时间，证据不足时明确说无法判断
  - 教师只问怎么备某一节时，先 resolve_topic 再 kp_heatmap，正文给出正确率、资源数、题量和建议题型。本轮明确说帮我出题、出小测或生成习题时：不要调用 kp_heatmap，不要写分配方案。范围、题量或题型有缺时先 offer_choices 让用户点选，禁止默认题量后直接出题；细节齐全再用 resolve_topic 收集 kp_id 并 prepare_ui_action(target=teacher.question.create, auto=true)。正文 1～2 句说明正在生成，不要提「预览题目」（生成中由前端显示进度，全部完成后才出现该按钮）。不要打开配置页。询问出题入口才用 teacher.question.generate
  - 只有课程知识讲解才用 resolve_topic 定位本课程的章和知识点；text 传用户原话整句，禁止拆词或自判知识点；上下文若有 q_id 必须传入
  - 学生讲解单个知识点时，resolve_topic 给出 kp_id 后调用 breakdown，按 depth 决定入门或易错点讲法；教师讲课不查个人正确率。两个概念的对比不套这套深浅，也不给去练按钮
  - 学生问某一道题为什么错、或能定位到题号时，get_question 之后调用 my_last_attempt；有错项就针对 selectedText 讲解，没有记录就按题面讲，不编造选项。教师不能调用该工具
  - 课程讲解即使 uncertain=true，仍用用户原话调用 retrieve_chunks；若有 q_id 调用 get_question（默认不要 include_answer）；retrieve_chunks 的 source_types 默认 question_analysis、textbook、ppt
  - 依据检索结果作答；正文使用题目和知识点名称，不主动输出 q_id / KP 编号，用户询问编号或需要区分对象时才提供；命中不足时用【补充】声明非课程原文，禁止伪造引用
  - 引用来源由系统通过 citations 事件单独展示；按 explain.md 简洁回答，保留解释结论所需的关键依据，不凑固定结构
  - 回答范围以用户问题为准；排名默认最多三项，列完后直接结束，不追加总结或邀请。唯一例外：学生 breakdown 返回 offerPractice=true 且不是概念对比时，最终回答前调用 suggest_action(kind=practice)，正文点明「去练」按钮，不代答、不提交
