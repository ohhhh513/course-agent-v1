id: generate_items
name: 智能出题
roles: [teacher]                     # 出题流只允许教师：会写入草稿，学生与管理员不可用（管理员走 admin_ops 流）
persona: course_tutor
skills:
  - generate_items.md
tools:
  - resolve_topic
  - retrieve_chunks
  - get_question
  - search_similar_questions
  - save_question_batch
max_steps: 12
steps:
  - resolve_topic 一次定位本批次范围；text 传教师原话整词，不要拆词。若 context 有 example_question_ids，逐个 get_question（可带答案）
  - retrieve_chunks 一次检索本批次所需的解析/教材，题意不得超出资料
  - search_similar_questions 一次检索防抄黑名单，禁止把命中题当作可微调骨架
  - 一次生成 context.count 道题；每道题都包含独立的 plan 与 question，题型按 context.question_types 的顺序逐题匹配
  - plan 必须写清提问目标、实例草图、逐步解题与正确答案、干扰项易错点、相对对照题的实质变化
  - question 只输出闭集字段（chapter_id / kp_ids 必须来自定位结果；不要输出 q_id，题号由系统分配）
  - 全部题目一次调用 save_question_batch；服务端会逐题执行结构、题型、知识点、构思和新颖度检查，全部通过后才会原子写入草稿
  - 若工具返回错误，只修正对应题目，再提交完整批次；不要改动已满足检查的题目
  - 提醒这是草稿，尚未进入正式题库
