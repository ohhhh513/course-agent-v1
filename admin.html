<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理员 · 课程智能体系统</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/refresh.css?v=20261019-blue">
  <link rel="stylesheet" href="assets/css/app.css?v=20261022-teacher-avatar">
  <script src="assets/js/ui-enhancements.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="brand-logo">管</div>
      <div class="brand-text"><b>系统管理</b><span>平台运维</span></div>
    </div>
    <nav class="sidebar__nav">
      <div class="nav-group">
        <div class="nav-group__label">管理</div>
        <button class="nav-item" data-view="assistant" data-icon="bot"><span class="nav-item__text">智能助手</span></button>
        <button class="nav-item" data-view="users" data-icon="users"><span class="nav-item__text">账号管理</span></button>
        <button class="nav-item" data-view="courses" data-icon="book"><span class="nav-item__text">课程管理</span></button>
      </div>
    </nav>
    <div class="sidebar__foot">
      <button class="user-chip" type="button">
        <span class="avatar" id="tbAvatar">管</span>
        <span class="user-chip__info"><b id="tbUserName">管理员</b><span id="tbUid">admin</span></span>
      </button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar__title"><h1 id="pageTitle">智能助手</h1></div>
      <div class="topbar__actions">
        <button class="btn btn--ghost btn--icon" id="logoutBtn" type="button" title="退出登录"></button>
      </div>
    </header>
    <main class="content">

      <!-- 账号管理（原单页逻辑整体迁入 views/users.js，行为不变） -->
      <section class="view fill" id="view-users">
        <div class="card">
          <div class="card__head">
            <h3>教师 / 学生账号</h3>
            <span class="spacer"></span>
            <button class="btn btn--primary btn--sm" id="btnCreate" type="button">新建账号</button>
            <button class="btn btn--sm" id="btnImport" type="button">批量导入</button>
            <button class="btn btn--danger btn--sm" id="btnBatchDel" type="button">批量删除</button>
            <select class="select select--sm" id="fRole" style="width:120px">
              <option value="">全部角色</option>
              <option value="teacher">教师</option>
              <option value="student">学生</option>
            </select>
            <div class="search" style="width:200px">
              <input class="input" id="fKey" placeholder="搜索用户名 / 姓名">
            </div>
          </div>
          <div class="card__body" style="min-height:0;overflow-x:hidden;overflow-y:auto">
            <table class="tbl" id="userTable">
              <thead><tr>
                <th style="width:32px"><input type="checkbox" id="pickAll" title="全选"></th>
                <th>用户名</th><th>姓名</th><th>角色</th><th>班级/部门</th><th>用户ID</th><th>操作</th>
              </tr></thead>
              <tbody><tr><td colspan="7" class="t-dim">加载中…</td></tr></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 课程管理 -->
      <section class="view fill" id="view-courses">
        <div class="card">
          <div class="card__head">
            <h3>课程</h3>
            <span class="spacer"></span>
            <button class="btn btn--primary btn--sm" id="btnCourseCreate" type="button">新建课程</button>
            <div class="search" style="width:220px">
              <input class="input" id="fCourse" placeholder="搜索课程名 / 代码 / 教师">
            </div>
          </div>
          <div class="card__body" style="min-height:0;overflow:auto">
            <table class="tbl tbl--compact" id="courseTable">
              <thead><tr>
                <th>课程</th><th>负责人</th><th>成员</th><th>内容</th><th>邀请码</th>
              </tr></thead>
              <tbody><tr><td colspan="5" class="t-dim">加载中…</td></tr></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 智能助手（平台治理流，复用 shared/agent-chat.js） -->
      <section class="view" id="view-assistant"></section>

    </main>
  </div>
</div>

<script src="assets/js/common.js?v=20261019-sidepane-full1"></script>
<script src="assets/js/api.js?v=20261022-ai-report"></script>
<script src="assets/js/auth.js?v=20261022-avatar-name"></script>
<script src="assets/js/shared/profile-center.js?v=20261016-avatar-sync"></script>
<script src="assets/js/shared/agent-chat.js?v=20261022-no-oos-callout"></script>
  <script src="assets/js/shared/agent-ui.js?v=20261022-ai-report"></script>
<script src="assets/js/admin/views/users.js?v=20261016-profile-center"></script>
<script src="assets/js/admin/views/courses.js?v=20261015-edit-backdrop"></script>
<script src="assets/js/admin/views/assistant.js?v=20261013-composer"></script>
<script src="assets/js/admin/app.js?v=20261013-assistant-mark"></script>
</body>
</html>
