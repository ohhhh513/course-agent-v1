<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" class="auth-skin">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找回密码 · 课程智能体</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css?v=20261014-login3">
<link rel="stylesheet" href="assets/css/refresh.css?v=20261014-login3">
<script src="assets/js/ui-enhancements.js" defer></script>
</head>
<body>

<div class="auth-bg" aria-hidden="true">
  <div class="auth-bg__slide is-on" style="background-image:url('assets/img/login/sanxia.jpg')"></div>
  <div class="auth-bg__slide" style="background-image:url('assets/img/login/wulong.jpg')"></div>
  <div class="auth-bg__slide" style="background-image:url('assets/img/login/ciqikou.jpg')"></div>
  <div class="auth-bg__slide" style="background-image:url('assets/img/login/jinfo.jpg')"></div>
</div>

<div class="auth-page">
  <header class="auth-welcome">
    <img class="auth-welcome__logo" src="assets/img/course-assistant.svg" alt="" draggable="false">
    <h1>欢迎使用「课程智能体」</h1>
  </header>

  <main class="auth-card">
    <div class="auth-card__mode">找回密码</div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label>账号</label>
        <input class="input" id="username" placeholder="请输入账号" autocomplete="username">
      </div>
      <div class="field">
        <label>新密码</label>
        <input class="input" id="password" type="password" placeholder="至少 6 位" autocomplete="new-password">
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input class="input" id="confirm" type="password" placeholder="再次输入新密码" autocomplete="new-password">
      </div>
      <div class="auth-error" id="resetErr"></div>
      <button class="btn btn--primary btn--block is-ready" id="resetBtn" type="submit">重置密码</button>
    </form>

    <div class="auth-foot"><a href="index.html">返回登录</a></div>
  </main>
</div>

<script src="assets/js/common.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  Theme.init();
  Auth.init();

  (function () {
    const slides = U.$$('.auth-bg__slide');
    if (slides.length < 2) return;
    let i = 0;
    setInterval(() => {
      slides[i].classList.remove('is-on');
      i = (i + 1) % slides.length;
      slides[i].classList.add('is-on');
    }, 8000);
  })();

  const form = U.$('#resetForm');
  const errEl = U.$('#resetErr');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.textContent = '';
    const username = U.$('#username').value.trim();
    const password = U.$('#password').value;
    const confirm = U.$('#confirm').value;

    if (!username) return void (errEl.textContent = '请输入账号');
    if (password.length < 6) return void (errEl.textContent = '新密码至少 6 位');
    if (password !== confirm) return void (errEl.textContent = '两次输入的密码不一致');

    const btn = U.$('#resetBtn');
    btn.disabled = true; btn.textContent = '重置中…';
    try {
      await Auth.resetPassword({ username, password });
      Toast.ok('密码已重置', '请使用新密码登录');
      setTimeout(() => { location.href = 'index.html'; }, 1100);
    } catch (err) {
      errEl.textContent = (err && err.message) || '重置失败，请重试';
      btn.disabled = false; btn.textContent = '重置密码';
    }
  });
</script>
</body>
</html>
